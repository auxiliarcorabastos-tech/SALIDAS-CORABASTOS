<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIERP — Full</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <button id="btnMenu" class="primary">☰</button>
    <div style="font-size:18px;font-weight:700">MIERP</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="small" id="headerUser">Invitado</div>
    <button id="btnLogout" class="primary hidden">Cerrar sesión</button>
  </div>
</header>

<div class="app">
  <aside id="sidebar">
    <button data-sec="dashboard">Dashboard</button>
    <button data-sec="fundaciones">Fundaciones</button>
    <button data-sec="items">Items</button>
    <button data-sec="conductores">Conductores</button>
    <button data-sec="recibos">Pedidos</button>
    <button data-sec="seguimiento">Seguimiento</button>
  </aside>

  <main id="main">
    <section id="dashboard" class="card"> <h2>Bienvenido</h2> <p class="small">MIERP Full package</p></section>

    <section id="fundaciones" class="hidden card">
      <h2>Fundaciones</h2>
      <div class="card small">
        <label>NIT</label><input id="f_nit">
        <label>Nombre</label><input id="f_name">
        <button id="btnFundCreate" class="primary">Crear Fundación</button>
      </div>
      <div class="card small">
        <input id="searchFund" placeholder="Buscar..." style="margin-bottom:10px">
        <div id="fundList"></div>
      </div>
    </section>

    <section id="items" class="hidden card">
      <h2>Items</h2>
      <div class="card small">
        <label>Ref</label><input id="item_ref">
        <label>Nombre</label><input id="item_name">
        <label>Precio</label><input id="item_price" type="number">
        <button id="btnCreateItem" class="primary">Agregar Item</button>
      </div>
      <div class="card small">
        <input id="searchItems" placeholder="Buscar..." style="margin-bottom:10px">
        <table id="itemsTable" class="table"><thead><tr><th>Ref</th><th>Nombre</th><th>Precio</th></tr></thead><tbody></tbody></table>
      </div>
    </section>

    <section id="conductores" class="hidden card">
      <h2>Conductores</h2>
      <div class="card small">
        <label>Nombre</label><input id="drv_name">
        <label>Documento</label><input id="drv_doc">
        <button id="btnAddDriver" class="primary">Agregar Conductor</button>
      </div>
      <div class="card small">
        <h3>Importar Placas</h3>
        <input id="excel_plates" type="file" accept=".xlsx,.xls" />
        <button id="btnImportPlates" class="primary">Importar Placas</button>
      </div>
      <div class="card small">
        <h3>Conductores</h3><ul id="driversList"></ul>
      </div>
      <div class="card small">
        <h3>Placas</h3><ul id="platesList"></ul>
      </div>
    </section>

    <section id="recibos" class="hidden card">
      <h2>Pedidos</h2>
      <div class="card small">
        <label>NIT Fundación</label><input id="pd_nit">
        <div id="pd_fund_info" class="small"></div>
        <label>Fundación</label><select id="pd_fund"></select>
        <label>Punto</label><select id="pd_point"></select>
        <label>Conductor</label><select id="pd_driver"></select>
        <label>Placa</label><select id="pd_plate"></select>
        <label>Peaje</label><input id="pd_peaje" type="number">
        <label>Transporte</label><input id="pd_trans" type="number">
        <h3>Items</h3>
        <select id="pd_item_sel"></select>
        <label>Kilos</label><input id="pd_kilos" type="number">
        <button id="pd_add_item" class="primary">Agregar Item</button>
        <ul id="pd_items_list"></ul>
        <div style="margin-top:10px">
          <button id="btnAddPedido" class="primary">Guardar Pedido</button>
          <button id="btnExportPedidoIMG" class="primary">Exportar Imagen Último Pedido</button>
        </div>
      </div>
      <div class="card small">
        <h3>Historial</h3>
        <ul id="pedidosList"></ul>
      </div>
    </section>

    <section id="seguimiento" class="hidden card">
      <h2>Seguimiento / Backup</h2>
      <button id="btnExportConfig" class="primary">Exportar configuración (JSON)</button>
      <input id="importConfig" type="file" accept=".json">
      <button id="btnImportConfig" class="primary">Importar JSON</button>
    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script type="module" src="js/state.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/pedidos.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
