<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP Corabastos</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#f4f6f9; }
    header {
      background:#071025; color:#fff; padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .app { display:flex; height:calc(100vh - 50px); }
    #sidebar {
      width:240px; background:#0b1220; color:#fff;
      padding:10px; display:flex; flex-direction:column; gap:6px;
    }
    #sidebar button {
      background:none; border:0; color:#cbd5e1;
      text-align:left; padding:10px; border-radius:6px;
      cursor:pointer;
    }
    #sidebar button:hover { background:#1e293b; }
    #sidebar.sidebar-hidden { display:none; }

    main { flex:1; padding:16px; overflow:auto; }
    section.hidden { display:none; }

    .card {
      background:#fff; border-radius:8px;
      padding:16px; margin-bottom:16px;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
    }

    .primary {
      background:#0a57ff; color:#fff; border:0;
      padding:8px 12px; border-radius:6px;
      cursor:pointer;
    }

    label { font-weight:600; margin-top:8px; display:block; }
    input, select {
      width:100%; padding:6px; margin-top:4px;
    }
  </style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <button id="btnMenu" class="primary">☰</button>
    <strong>ERP Corabastos</strong>
  </div>
  <div id="headerUser">Invitado</div>
</header>

<div class="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <button data-sec="dashboard">Dashboard</button>
    <button data-sec="fundaciones">Fundaciones</button>
    <button data-sec="items">Items</button>
    <button data-sec="conductores">Conductores</button>
    <button data-sec="recibos">Pedidos</button>
  </aside>

  <!-- CONTENIDO -->
  <main id="main">

    <section id="dashboard" class="card">
      <h2>Bienvenido</h2>
      <p>Sistema ERP Corabastos</p>
    </section>

    <!-- FUNDACIONES -->
    <section id="fundaciones" class="hidden">
      <div class="card">
        <h2>Fundaciones</h2>

        <label>NIT</label>
        <input id="fund_nit">

        <label>Nombre</label>
        <input id="fund_name">

        <button id="btnCreateFund" class="primary" style="margin-top:10px">
          Guardar Fundación
        </button>
      </div>

      <div class="card">
        <h3>Listado</h3>
        <ul id="fundList"></ul>
      </div>
    </section>

    <!-- ITEMS -->
    <section id="items" class="hidden">
      <div class="card">
        <h2>Items</h2>

        <label>Referencia</label>
        <input id="item_ref">

        <label>Nombre</label>
        <input id="item_name">

        <label>Precio</label>
        <input id="item_price" type="number">

        <button id="btnCreateItem" class="primary" style="margin-top:10px">
          Guardar Item
        </button>
      </div>

      <div class="card">
        <h3>Listado</h3>
        <ul id="itemsList"></ul>
      </div>
    </section>

    <!-- CONDUCTORES -->
    <section id="conductores" class="hidden">
      <div class="card">
        <h2>Conductores</h2>

        <label>Nombre</label>
        <input id="drv_name">

        <label>Documento</label>
        <input id="drv_doc">

        <label>Teléfono</label>
        <input id="drv_tel">

        <button id="btnAddDriver" class="primary" style="margin-top:10px">
          Guardar Conductor
        </button>
      </div>

      <div class="card">
        <h3>Placas</h3>
        <label>Placa</label>
        <input id="pl_plate">
        <label>Tipo</label>
        <input id="pl_type">
        <button id="btnAddPlate" class="primary">Agregar Placa</button>
        <ul id="platesList"></ul>
      </div>
    </section>

    <!-- PEDIDOS -->
    <section id="recibos" class="hidden">
      <div class="card">
        <h2>Pedidos</h2>

        <label>NIT Fundación</label>
        <input id="pd_nit">

        <label>Fundación</label>
        <select id="pd_fund"></select>

        <label>Punto de Envío</label>
        <select id="pd_point"></select>

        <button id="btnAddPedido" class="primary" style="margin-top:10px">
          Guardar Pedido
        </button>
      </div>

      <div class="card">
        <h3>Historial</h3>
        <ul id="pedidosList"></ul>
      </div>
    </section>

  </main>
</div>

<!-- LIBRERÍA EXCEL -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- JS DEL ERP -->
<script type="module" src="js/state.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/fundaciones.js"></script>
<script type="module" src="js/conductores.js"></script>
<script type="module" src="js/pedidos.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
